[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysendpulse"
dynamic = ["version"]
description = "Official Python SDK for the SendPulse REST API"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
keywords = ["sendpulse", "api", "rest", "sdk", "email", "sms", "crm", "chatbots"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "SendPulse", email = "tech@sendpulse.com" },
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/sendpulse/sendpulse-rest-api-python"
Repository = "https://github.com/sendpulse/sendpulse-rest-api-python"

[tool.hatch.version]
path = "sendpulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sendpulse"]

[tool.mypy]
python_version = "3.11"
strict = true
# Generated map fragments are plain data literals — no value in type-checking them.
exclude = ["sendpulse/resources/operations/"]

[tool.ruff]
target-version = "py311"
line-length = 120
# Generated files: long data lines in the map fragments, long docstrings in the stub.
exclude = [".venv", "sendpulse/resources/operations", "sendpulse/stubs.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
